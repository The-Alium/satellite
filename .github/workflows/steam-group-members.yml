name: Fetch Steam Group Members

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */7 * *"

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch group members
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_GROUP: ${{ vars.STEAM_GROUP }}
        run: python scripts/fetch_members.py

      - name: Commit members.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add members.json
          git commit -m "Update Steam group members" || echo "No changes"
          git push
